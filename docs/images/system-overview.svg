" x="796" y="366" text-anchor="start">PC・スマホのブラウザ</text><text class="d-m" x="796" y="386" text-anchor="start">http://&lt;UNO Q&gt;:8000</text><text class="d-z" x="20" y="470" text-anchor="start">PHASE 2　管理機能を別PCへ移す</text><rect class="d-zone" x="20" y="484" width="960" height="160" rx="12"/><text class="d-z" x="34" y="506">接続先 MGMT_URL を変えるだけで移行</text><rect class="d-box" x="56" y="508" width="250" height="96" rx="8"/><rect class="d-box" x="50" y="514" width="250" height="96" rx="8"/><rect class="d-box" x="44" y="520" width="250" height="96" rx="8"/><text class="d-h" x="58" y="542" text-anchor="start">UNO Q（端末・複数台可）</text><text class="d-t" x="58" y="566" text-anchor="start">nfc-agent + Edge + LED</text><text class="d-m" x="58" y="586" text-anchor="start">MGMT_URL=http://mgmt-pc:8000</text><path class="d-ar" d="M298,568 L428,568" marker-end="url(#ah)"/><text class="d-a" x="363" y="558" text-anchor="middle">HTTP + 端末トークン</text><rect class="d-box2" x="430" y="520" width="290" height="96" rx="8"/><text class="d-h" x="442" y="542">管理PC（Docker）</text><text class="d-t" x="444" y="564">Management：Phase 1 と同じコード</text><text class="d-t" x="444" y="583">DB：SQLite → PostgreSQL（任意）</text><path class="d-ar" d="M722,568 L794,568" marker-end="url(#ah)" marker-start="url(#ah)"/><rect class="d-box" x="796" y="530" width="168" height="76" rx="8"/><text class="d-h" x="808" y="552">Web 管理画面</text><text class="d-t" x="810" y="574">URL が管理PCに変わる</text></svg>
