</defs><rect class="d-bg" x="0" y="0" width="1000" height="660"/><text class="d-z" x="20" y="26" text-anchor="start">PHASE 1　UNO Q 1台で全機能を動かす</text><rect class="d-zone" x="20" y="40" width="250" height="390" rx="12"/><text class="d-z" x="34" y="62">設置場所（貸出カウンター）</text><rect class="d-box" x="40" y="78" width="110" height="58" rx="8"/><text class="d-h" x="52" y="100">ユーザー</text><text class="d-t" x="54" y="122">社員証に貼付</text><circle class="d-tag" cx="128" cy="95" r="11"/><text class="d-a" x="128" y="99" text-anchor="middle" style="font-size:8px">NFC</text><rect class="d-box" x="40" y="176" width="110" height="58" rx="8"/><text class="d-h" x="52" y="198">備品</text><text class="d-t" x="54" y="220">PC・工具など</text><circle class="d-tag" cx="128" cy="193" r="11"/><text class="d-a" x="128" y="197" text-anchor="middle" style="font-size:8px">NFC</text><rect class="d-box2" x="172" y="112" width="88" height="88" rx="8"/><text class="d-h" x="216" y="134" text-anchor="middle">RC-S380</text><text class="d-s" x="216" y="152" text-anchor="middle">または</text><text class="d-m" x="216" y="168" text-anchor="middle">ZW-12026-12</text><text class="d-s" x="216" y="190" text-anchor="middle">NFCリーダー</text><path class="d-ar" d="M150,112 L170,132" marker-end="url(#ah)"/><path class="d-ar" d="M150,200 L170,180" marker-end="url(#ah)"/><text class="d-a" x="158" y="108" text-anchor="start">①</text><text class="d-a" x="158" y="222" text-anchor="start">②</text><rect class="d-box" x="166" y="268" width="94" height="66" rx="8"/><text class="d-h" x="178" y="290">USB-C ハブ</text><text class="d-t" x="180" y="312">給電(PD)付き</text><path class="d-arm" d="M216,200 L216,266" marker-end="url(#am)"/><text class="d-s" x="222" y="236" text-anchor="start">USB</text><rect class="d-box" x="40" y="268" width="110" height="66" rx="8"/><text class="d-h" x="52" y="290">NTAG215</text><text class="d-t" x="54" y="312">UIDだけを使用</text><text class="d-t" x="40" y="368" text-anchor="start">① ユーザー → ② 備品 の順にタッチ</text><text class="d-s" x="40" y="390" text-anchor="start">同じ操作で貸出・返却・切替を判定</text><text class="d-s" x="40" y="410" text-anchor="start">（判定は管理機能が行う）</text><rect class="d-zone" x="300" y="40" width="450" height="390" rx="12"/><text class="d-z" x="314" y="62">ARDUINO UNO Q</text><text class="d-s" x="318" y="84" text-anchor="start">MPU（Linux）</text><rect class="d-box" x="318" y="94" width="190" height="150" rx="8"/><text class="d-h" x="330" y="116">Edge（App コンテナ）</text><text class="d-m" x="332" y="138">touch_fsm</text><text class="d-m" x="332" y="157">mgmt_client</text><text class="d-m" x="332" y="176">display</text><text class="d-s" x="332" y="204" text-anchor="start">2段階タッチの状態管理</text><text class="d-s" x="332" y="221" text-anchor="start">管理機能の呼出し・LED指示</text><rect class="d-box2" x="318" y="262" width="136" height="48" rx="8"/><text class="d-h" x="330" y="284">nfc-agent</text><text class="d-s" x="332" y="300" text-anchor="start">別コンテナ・USB読取</text><path class="d-ar" d="M373,260 L373,246" marker-end="url(#ah)"/><text class="d-a" x="380" y="256" text-anchor="start">UID（HTTP）</text><rect class="d-box2" x="540" y="94" width="192" height="212" rx="8"/><text class="d-h" x="552" y="116">Management（管理機能）</text><text class="d-t" x="554" y="138">REST API / WebSocket</text><text class="d-t" x="554" y="157">業務ルール（貸出判定）</text><text class="d-t" x="554" y="176">DB（SQLite）</text><text class="d-t" x="554" y="195">Web UI（静的ファイル）</text><text class="d-s" x="554" y="214" text-anchor="start">FastAPI 単体アプリ</text><text class="d-a" x="554" y="231" text-anchor="start">→ Phase 2 でそのまま移設</text><path class="d-ar" d="M508,160 L538,160" marker-end="url(#ah)"/><text class="d-a" x="524" y="150" text-anchor="middle">HTTP</text><rect class="d-box" x="318" y="322" width="414" height="94" rx="8"/><text class="d-h" x="332" y="344" text-anchor="start">MCU（STM32 / sketch.ino）</text><text class="d-m" x="332" y="366" text-anchor="start">Bridge.provide("show", …)</text><text class="d-s" x="332" y="386" text-anchor="start">LED Matrix 8×1