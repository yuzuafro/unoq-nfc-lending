<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-label="プロセスとスレッドの構成"><title>プロセスとスレッドの構成</title>
<style>
svg{--bg:#F4F7F8;--sf:#FFFFFF;--ink:#15212B;--mu:#5C6B75;--ln:#C9D4DA;--ac:#00818A;--acs:#E0F1F2;--led:#3D7BFF;--ok:#15803D}
@media (prefers-color-scheme:dark){svg{--bg:#0E1519;--sf:#152026;--ink:#E2EAEE;--mu:#8FA0AA;--ln:#2E3E47;--ac:#3CBFC7;--acs:#16353A;--led:#7AA2FF;--ok:#4ADE80}}
</style><style>
.d-bg{fill:var(--bg)}
.d-zone{fill:none;stroke:var(--ln);stroke-width:1.2;stroke-dasharray:5 4}
.d-box{fill:var(--sf);stroke:var(--ln);stroke-width:1.2}
.d-box2{fill:var(--acs);stroke:var(--ac);stroke-width:1.2}
.d-t{fill:var(--ink);font-family:'IBM Plex Sans JP','Noto Sans JP','Hiragino Sans',sans-serif;font-size:13px}
.d-h{fill:var(--ink);font-family:'IBM Plex Sans JP','Noto Sans JP','Hiragino Sans',sans-serif;font-size:14px;font-weight:600}
.d-z{fill:var(--mu);font-family:'IBM Plex Sans JP','Noto Sans JP','Hiragino Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:.06em}
.d-s{fill:var(--mu);font-family:'IBM Plex Sans JP','Noto Sans JP','Hiragino Sans',sans-serif;font-size:11.5px}
.d-m{fill:var(--mu);font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11.5px}
.d-a{fill:var(--ac);font-family:'IBM Plex Sans JP','Noto Sans JP','Hiragino Sans',sans-serif;font-size:11.5px;font-weight:600}
.d-ar{stroke:var(--ac);stroke-width:1.6;fill:none}
.d-arm{stroke:var(--mu);stroke-width:1.3;fill:none;stroke-dasharray:4 3}
.d-head{fill:var(--ac)}
.d-headm{fill:var(--mu)}
.d-tag{fill:var(--sf);stroke:var(--ac);stroke-width:2}
.d-led-on{fill:var(--led)}
.d-led-off{fill:var(--ln)}
.d-led-lit{fill:#6FA0FF}.d-led-dark{fill:#1A2740}</style><defs>
