<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="開発時の構成"><title>開発時の構成</title>
<style>
svg{--bg:#F4F7F8;--sf:#FFFFFF;--ink:#15212B;--mu:#5C6B75;--ln:#C9D4DA;--ac:#00818A;--acs:#E0F1F2;--led:#3D7BFF;--ok:#15803D}
@media (prefers-color-scheme:dark){svg{--bg:#0E1519;--sf:#152026;--ink:#E2EAEE;--mu:#8FA0AA;--ln:#2E3E47;--ac:#3CBFC7;--acs:#16353A;--led:#7AA2FF;--ok:#4ADE80}}
</style><style>
.d-bg{fill:var(--bg)}
.d-zone{fill:none;stroke:var(--ln);stroke-width:1.2;stroke-dasharray:5 4}
.d-box{fill:var(--sf);stroke:var(--ln);stroke-width:1.2}
.d-box2{fill:var(--acs);stroke:var(--ac);stroke-width:1.2}
.d-t{fill:var(--ink);font-family:'IBM Plex Sans JP','Noto Sans JP','Hiragino Sans',sans-serif;font-size:13px}
.d-h{fill:var(--ink);font-family:'IBM Plex Sans JP','Noto Sans JP','Hiragino Sans',sans-serif;font-size:14px;font-weight:600}
.d-z{fill:var(--mu);font-family:'IBM Plex Sans JP','Noto Sans JP','Hiragino Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:.06em}
.d-s{fill:var(--mu);font-family:'IBM Plex Sans JP','Noto Sans JP','Hiragino Sans',sans-serif;font-size:11.5px}
.d-m{fill:var(--mu);font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11.5px}
.d-a{fill:var(--ac);font-family:'IBM Plex Sans JP','Noto Sans JP','Hiragino Sans',sans-serif;font-size:11.5px;font-weight:600}
.d-ar{stroke:var(--ac);stroke-width:1.6;fill:none}
.d-arm{stroke:var(--mu);stroke-width:1.3;fill:none;stroke-dasharray:4 3}
.d-head{fill:var(--ac)}
.d-headm{fill:var(--mu)}
.d-tag{fill:var(--sf);stroke:var(--ac);stroke-width:2}
.d-led-on{fill:var(--led)}
.d-led-off{fill:var(--ln)}
.d-led-lit{fill:#6FA0FF}.d-led-dark{fill:#1A2740}</style><defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M0,0L10,5L0,10z"/></marker>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-headm" d="M0,0L10,5L0,10z"/></marker>
</defs><rect class="d-bg" x="0" y="0" width="960" height="420"/><text class="d-z" x="20" y="26" text-anchor="start">① 単体テスト</text><rect class="d-zone" x="20" y="40" width="288" height="360" rx="12"/><text class="d-z" x="34" y="62">UNO Q か Docker のある PC</text><rect class="d-box2" x="36" y="76" width="256" height="169" rx="8"/><text class="d-h" x="48" y="98">一時コンテナ</text><text class="d-t" x="50" y="120">python-apps-base + pytest</text><rect class="d-box" x="52" y="134" width="224" height="95" rx="8"/><text class="d-h" x="64" y="156">pytest</text><text class="d-m" x="66" y="178">test_management.py</text><text class="d-m" x="66" y="197">test_edge.py</text><text class="d-m" x="66" y="216">test_agent.py</text><path class="d-ar" d="M164.0,229 L164.0,264" marker-end="url(#ah)"/><path class="d-box2" d="M80,274 L80,322 A84.0,8 0 0 0 248,322 L248,274"/><ellipse class="d-box2" cx="164.0" cy="274" rx="84.0" ry="8"/><text class="d-h" x="164.0" y="298" text-anchor="middle">SQLite</text><text class="d-s" x="164.0" y="316" text-anchor="middle">テストごとに作って捨てる</text><text class="d-m" x="36" y="352" text-anchor="start">sh tests/run.sh</text><text class="d-s" x="36" y="370" text-anchor="start">Edge は偽の API・LED で検証</text><text class="d-s" x="36" y="388" text-anchor="start">起動中の App には影響しない</text><text class="d-z" x="336" y="26" text-anchor="start">② 実機の App ＋ 疑似リーダー</text><rect class="d-zone" x="336" y="40" width="288" height="360" rx="12"/><text class="d-z" x="350" y="62">UNO Q</text><rect class="d-box2" x="352" y="76" width="120" height="70" rx="8"/><text class="d-h" x="364" y="98">疑似リーダー</text><text class="d-m" x="366" y="120">:8100</text><path class="d-ar" d="M608,111 L474,111" marker-end="url(#ah)"/><text class="d-a" x="486" y="102" text-anchor="start">curl /inject</text><rect class="d-box2" x="352" y="168" width="256" height="90" rx="8"/><text class="d-h" x="364" y="190">App コンテナ</text><text class="d-t" x="366" y="212">Edge ＋ Management</text><text class="d-t" x="366" y="231">app start で起動  :8000</text><path class="d-ar" d="M412,146 L412,166" marker-end="url(#ah)"/><text class="d-a" x="420" y="161" text-anchor="start">UID</text><path class="d-box2" d="M352,308 L352,352 A65.0,8 0 0 0 482,352 L482,308"/><ellipse class="d-box2" cx="417.0" cy="308" rx="65.0" ry="8"/><text class="d-h" x="417.0" y="332" text-anchor="middle">SQLite</text><text class="d-s" x="417.0" y="350" text-anchor="middle">本番の data/nfc.db</text><rect class="d-box" x="498" y="300" width="110" height="60" rx="8"/><text class="d-h" x="510" y="322">MCU</text><text class="d-t" x="512" y="344">LED 表示</text><path class="d-ar" d="M417,258 L417,298" marker-end="url(#ah)"/><path class="d-ar" d="M553,258 L553,298" marker-end="url(#ah)"/><text class="d-s" x="352" y="386" text-anchor="start">リーダーなしでタッチと LED を確認</text><text class="d-z" x="652" y="26" text-anchor="start">③ Management 単体</text><rect class="d-zone" x="652" y="40" width="288" height="360" rx="12"/><text class="d-z" x="666" y="62">PC か UNO Q（Docker）</text><rect class="d-box2" x="668" y="76" width="256" height="80" rx="8"/><text class="d-h" x="680" y="98">management コンテナ</text><text class="d-t" x="682" y="120">deploy/management  :8000</text><path class="d-box2" d="M668,184 L668,228 A65.0,8 0 0 0 798,228 L798,184"/><ellipse class="d-box2" cx="733.0" cy="184" rx="65.0" ry="8"/><text class="d-h" x="733.0" y="208" text-anchor="middle">SQLite</text><text class="d-s" x="733.0" y="226" text-anchor="middle">deploy/…/nfc.db</text><path class="d-ar" d="M733,156 L733,174" marker-end="url(#ah)"/><rect class="d-box" x="814" y="176" width="90" height="50" rx="8"/><text class="d-h" x="826" y="198">ブラウザ</text><text class="d-t" x="828" y="220">Web UI</text><path class="d-ar" d="M859,176 L859,158" marker-end="url(#ah)"/><rect class="d-box" x="814" y="242" width="110" height="54" rx="8"/><text class="d-h" x="826" y="264">curl</text><text class="d-t" x="828" y="286">端末の代わり</text><path class="d-ar" d="M916,242 L916,158" marker-end="url(#ah)"/><text class="d-s" x="668" y="344" text-anchor="start">Web UI の変更：ブラウザを再読込</text><text class="d-s" x="668" y="364" text-anchor="start">Python の変更：コンテナを再起動</text><text class="d-s" x="668" y="382" text-anchor="start">Edge・LED・リーダーは動かない</text></svg>
