338,258 L338,350" marker-end="url(#ah)"/><text class="d-a" x="346" y="306" text-anchor="start">Bridge</text><text class="d-m" x="20" y="424" text-anchor="start">ブラウザ → http://&lt;UNO Q&gt;:8000</text><text class="d-z" x="490" y="26" text-anchor="start">PHASE 2　管理機能を管理PCへ</text><rect class="d-zone" x="490" y="40" width="450" height="196" rx="12"/><text class="d-z" x="504" y="62">Arduino UNO Q（端末・複数台可）</text><rect class="d-box" x="506" y="76" width="130" height="56" rx="8"/><text class="d-h" x="518" y="98">nfc-agent</text><text class="d-t" x="520" y="120">USB 読取</text><path class="d-ar" d="M636,104 L650,104" marker-end="url(#ah)"/><rect class="d-box2" x="652" y="76" width="272" height="76" rx="8"/><text class="d-h" x="664" y="98">App コンテナ</text><text class="d-t" x="666" y="120">Edge のみ</text><text class="d-t" x="666" y="139">RUN_MANAGEMENT=false</text><rect class="d-box" x="506" y="150" width="130" height="56" rx="8"/><text class="d-h" x="518" y="172">MCU</text><text class="d-t" x="520" y="194">LED 表示</text><path class="d-ar" d="M700,152 L700,178 L638,178" marker-end="url(#ah)"/><text class="d-s" x="652" y="206" text-anchor="start">data/app.env に</text><text class="d-m" x="652" y="223" text-anchor="start">MGMT_URL・DEVICE_TOKEN</text><rect class="d-zone" x="490" y="262" width="450" height="150" rx="12"/><text class="d-z" x="504" y="284">管理PC（Docker）</text><path class="d-box2" d="M506,304 L506,352 A95.0,8 0 0 0 696,352 L696,304"/><ellipse class="d-box2" cx="601.0" cy="304" rx="95.0" ry="8"/><text class="d-h" x="601.0" y="328" text-anchor="middle">SQLite / PostgreSQL</text><text class="d-s" x="601.0" y="346" text-anchor="middle">deploy/…/nfc.db</text><rect class="d-box2" x="720" y="298" width="204" height="62" rx="8"/><text class="d-h" x="732" y="320">management コンテナ</text><text class="d-t" x="734" y="342">deploy/management :8000</text><path class="d-ar" d="M718,329 L698,329" marker-end="url(#ah)"/><path class="d-ar" d="M840,152 L840,296" marker-end="url(#ah)"/><text class="d-a" x="832" y="252" text-anchor="end">HTTP＋端末トークン</text><text class="d-m" x="490" y="436" text-anchor="start">ブラウザ → http://&lt;管理PC&gt;:8000</text></svg>
